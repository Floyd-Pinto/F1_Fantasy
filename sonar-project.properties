# SonarQube analysis for F1 Fantasy (run by the Jenkins "SonarQube analysis" stage; see docs/DEVOPS.md).
# The server URL and token are injected by Jenkins' withSonarQubeEnv('SonarQube').
sonar.projectKey=f1-fantasy
sonar.projectName=F1 Fantasy
sonar.sourceEncoding=UTF-8

# Application code (backend JS + frontend TS/React)
sonar.sources=Backend/src,Backend/index.js,Frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/generated/**

# Tests and coverage (lcov from `npm run test:coverage` in Backend/)
sonar.tests=Backend/test
sonar.javascript.lcov.reportPaths=Backend/coverage/lcov.info

# The frontend has no unit tests yet; keep it out of the coverage figure (still fully analysed for bugs/smells)
sonar.coverage.exclusions=Frontend/src/**
