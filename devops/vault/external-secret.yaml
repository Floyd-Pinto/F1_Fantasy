# STATUS: PLANNED — External Secrets Operator syncs Vault → the Kubernetes Secret the Helm chart uses
# (values-prod.yaml: secrets.existingSecret = f1-fantasy-secrets). Nothing secret is committed to Git.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: f1-fantasy
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: f1-fantasy
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: f1-fantasy-secrets
  namespace: f1-fantasy
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: SecretStore }
  target: { name: f1-fantasy-secrets }
  data:
    - { secretKey: JWT_SECRET, remoteRef: { key: f1-fantasy, property: jwt_secret } }
    - { secretKey: JWT_REFRESH_SECRET, remoteRef: { key: f1-fantasy, property: jwt_refresh_secret } }
    - { secretKey: POSTGRES_PASSWORD, remoteRef: { key: f1-fantasy, property: postgres_password } }
    - { secretKey: DATABASE_URL, remoteRef: { key: f1-fantasy, property: database_url } }
