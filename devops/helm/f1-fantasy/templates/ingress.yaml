{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "f1.name" . }}
  labels: {{- include "f1.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.webHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "f1.name" . }}-frontend, port: { name: http } } }
    - host: {{ .Values.ingress.apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "f1.name" . }}-backend, port: { name: http } } }
{{- end }}
