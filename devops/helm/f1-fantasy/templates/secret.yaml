{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "f1.secretName" . }}
  labels: {{- include "f1.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ default (printf "postgresql://postgres:%s@%s-postgres:5432/%s" .Values.secrets.postgresPassword .Release.Name .Values.postgres.database) .Values.secrets.databaseUrl | quote }}
  SEED_ADMIN_EMAIL: {{ .Values.secrets.seedAdminEmail | quote }}
  SEED_ADMIN_PASSWORD: {{ .Values.secrets.seedAdminPassword | quote }}
{{- end }}
