{{- /* Needs kube-prometheus-stack CRDs and the backend /metrics endpoint (docs/DEVOPS.md → metrics contract). */ -}}
{{- if .Values.monitoring.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "f1.name" . }}-backend
  labels: {{- include "f1.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
{{- if .Values.monitoring.alertRules }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "f1.name" . }}-alerts
  labels: {{- include "f1.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  groups:
    - name: f1-fantasy
      rules:
        - alert: F1BackendDown
          expr: up{job=~".*{{ include "f1.name" . }}-backend.*"} == 0
          for: 5m
          labels: { severity: critical }
          annotations: { summary: "F1 Fantasy API is down" }
        - alert: F1HighErrorRate
          expr: sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m])) / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
          for: 10m
          labels: { severity: warning }
          annotations: { summary: "More than 5% of API requests are failing" }
        - alert: F1SlowResponses
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
          for: 10m
          labels: { severity: warning }
          annotations: { summary: "API p95 latency above 1s" }
        - alert: F1DataSyncFailing
          expr: increase(f1_job_runs_total{job="sync",result="failure"}[12h]) >= 2
          labels: { severity: warning }
          annotations: { summary: "Real F1 data sync failed twice in 12h (Jolpica/OpenF1 down or changed?)" }
        - alert: F1ResultsOverdue
          expr: f1_races_awaiting_results_hours > 24
          labels: { severity: warning }
          annotations: { summary: "A race finished over 24h ago and still has no official results imported" }
{{- end }}
{{- if .Values.monitoring.grafanaDashboard }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "f1.name" . }}-dashboard
  labels: {{- include "f1.labels" . | nindent 4 }}
    grafana_dashboard: "1"   # picked up by the Grafana sidecar in kube-prometheus-stack
data:
  f1-fantasy.json: |-
{{ .Files.Get "dashboards/f1-fantasy.json" | indent 4 }}
{{- end }}
