apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "f1.name" . }}-backend
  labels: {{- include "f1.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: Recreate   # single instance by design: never run two cron schedulers at once
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend }
  template:
    metadata:
      labels: {{- include "f1.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- if not .Values.backend.seedOnStart }}
          command: ["sh", "-c", "npx prisma migrate deploy && node index.js"]
          {{- end }}
          ports: [{ containerPort: {{ .Values.backend.port }}, name: http }]
          env:
            - { name: PORT, value: {{ .Values.backend.port | quote }} }
            {{- range $k, $v := .Values.backend.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          envFrom:
            - secretRef: { name: {{ include "f1.secretName" . }} }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 90   # first start migrates + syncs real data
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "f1.name" . }}-backend
  labels: {{- include "f1.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend }
  ports: [{ port: 80, targetPort: http, name: http }]
